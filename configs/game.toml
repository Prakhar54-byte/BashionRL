
[window]
title = "BastionRL"
width = 960
height = 640
fps = 60

[grid]
rows = 20
cols = 30
tile_size = 50

[assets.map]
path = "Assets/Maps/map1.png"
pathway = "Assets/Maps/map1.tmj"

[assets.enemies]
enemy1 = "Assets/Main/Entities/Enemies/enemy1.png"
enemy2 = "Assets/Main/Entities/Enemies/enemy2.png"
tank = "Assets/Main/Entities/Enemies/enemy2.png"

[assets.defense]
slot = "Assets/Main/Entities/Defense/slot.png"
cannon = "Assets/Main/Entities/Defense/cannon.png"
double_cannon = "Assets/Main/Entities/Defense/double_cannon.png"

[enemies.enemy1]
name = "Walking Soldier"
speed = 90.0
max_health = 100.0
kill_reward = 25
attack_damage = 10.0
attack_interval = 1.0
attack_range = 85.0

[enemies.enemy2]
name = "Advanced Soldier"
speed = 110.0
max_health = 180.0
kill_reward = 40
attack_damage = 15.0
