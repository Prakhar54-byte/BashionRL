[project]
name = "bashionrl"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pygame>=2.6.1",
    "ruff>=0.17.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/game"]

[tool.ruff.lint]
ignore = ["EXE002"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]