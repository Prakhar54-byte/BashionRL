[project]
name = "bashionrl"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pygame>=2.6.1",
    "ruff>=0.17.1",
]

[project.optional-dependencies]
rl = [
    "gymnasium>=1.2,<2",
    "numpy>=1.26,<3",
    "sb3-contrib>=2.7,<3",
    "torch>=2.5",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/game"]

[tool.ruff.lint]
ignore = ["EXE002"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
